name: Apply Editor 0.3 Integration

on:
  push:
    branches:
      - agent/0.3-dev
    paths:
      - .github/workflows/apply-editor-0.3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.3-dev
          fetch-depth: 0

      - name: Integrate Esc menu, printing, and word wrapping
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/org/pinnacle/texteditor/ui/EditorWindow.java")
          text = path.read_text()

          text = text.replace(
              "import java.awt.event.WindowEvent;\nimport java.io.IOException;",
              "import java.awt.event.WindowEvent;\nimport java.awt.print.PrinterException;\n"
              "import java.awt.print.PrinterJob;\nimport java.io.IOException;"
          )
          text = text.replace(
              "import java.util.List;\n",
              "import java.util.List;\nimport java.util.concurrent.CompletableFuture;\n"
              "import java.util.concurrent.CompletionException;\n"
          )
          text = text.replace(
              "    private final UpdateInstaller updateInstaller = new UpdateInstaller();\n",
              "    private final UpdateInstaller updateInstaller = new UpdateInstaller();\n"
              "    private final DocumentPrintService printService = new DocumentPrintService();\n"
          )
          text = text.replace("editor.setWrapStyleWord(false);", "editor.setWrapStyleWord(true);")

          old_keys = '''        bind(input, actions, "quit", KeyEvent.VK_F1, this::requestQuit);
                  bind(input, actions, "save", KeyEvent.VK_F2, this::requestSave);
                  bind(input, actions, "open", KeyEvent.VK_F3, this::requestOpen);
                  bind(input, actions, "new", KeyEvent.VK_F4, this::requestNew);
                  bind(input, actions, "update", KeyEvent.VK_F5, () -> checkForUpdates(true));
          
                  input.put(KeyStroke.getKeyStroke(KeyEvent.VK_F4, KeyEvent.ALT_DOWN_MASK), "quit");'''
          new_keys = '''        bind(input, actions, "main-menu", KeyEvent.VK_ESCAPE, this::showMainMenu);
          
                  input.put(KeyStroke.getKeyStroke(KeyEvent.VK_F4, KeyEvent.ALT_DOWN_MASK), "quit");
                  actions.put("quit", new AbstractAction() {
                      @Override
                      public void actionPerformed(ActionEvent event) {
                          if (!overlayOpen) {
                              requestQuit();
                          }
                      }
                  });'''
          if old_keys not in text:
              raise SystemExit("The expected function-key block was not found.")
          text = text.replace(old_keys, new_keys)

          marker = "    private void requestQuit() {\n"
          methods = '''    private void showMainMenu() {
                  showOverlay(new MainMenuDialog(
                          List.of(
                                  new ChoiceDialog.Choice("Save Document", () -> runMenuAction(
                                          () -> saveDocument(false, this::showSavedConfirmation)
                                  )),
                                  new ChoiceDialog.Choice("Open Document", () -> runMenuAction(this::requestOpen)),
                                  new ChoiceDialog.Choice("New Document", () -> runMenuAction(this::requestNew)),
                                  new ChoiceDialog.Choice("Print Document", () -> runMenuAction(this::requestPrint)),
                                  new ChoiceDialog.Choice("Check for Updates", () -> runMenuAction(
                                          () -> checkForUpdates(true)
                                  )),
                                  new ChoiceDialog.Choice("Exit Program", () -> runMenuAction(this::requestQuit))
                          ),
                          this::closeOverlay
                  ));
              }
          
              private void runMenuAction(Runnable action) {
                  closeOverlay();
                  action.run();
              }
          
              private void requestPrint() {
                  if (editor.getText().isEmpty()) {
                      showMessage("There is no text to print.");
                      return;
                  }
          
                  String documentName = currentFile == null
                          ? "Pinnacle Text Editor Document"
                          : currentFile.getFileName().toString();
                  PrinterJob job;
                  try {
                      job = printService.createPrintJob(editor.getText(), editor.getFont(), documentName);
                  } catch (RuntimeException exception) {
                      showMessage("Printing is unavailable: " + exception.getMessage());
                      return;
                  }
          
                  boolean accepted;
                  try {
                      accepted = job.printDialog();
                  } catch (RuntimeException exception) {
                      showMessage("Unable to open the printer dialog: " + exception.getMessage());
                      return;
                  }
                  if (!accepted) {
                      editor.requestFocusInWindow();
                      return;
                  }
          
                  showOverlay(new BusyDialog("Printing document..."));
                  CompletableFuture.runAsync(() -> {
                      try {
                          job.print();
                      } catch (PrinterException exception) {
                          throw new CompletionException(exception);
                      }
                  }).whenComplete((ignored, error) -> SwingUtilities.invokeLater(() -> {
                      closeOverlay();
                      if (error != null) {
                          showMessage("Unable to print the document: " + error.getCause().getMessage());
                      } else {
                          showMessage("Document sent to the printer.");
                      }
                  }));
              }
          
          '''
          if marker not in text:
              raise SystemExit("The requestQuit insertion point was not found.")
          text = text.replace(marker, methods + marker, 1)
          path.write_text(text)

      - name: Remove temporary integration workflow
        run: rm .github/workflows/apply-editor-0.3.yml

      - name: Commit integrated editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Pinnacle Text Editor 0.3 features"
          git push origin HEAD:agent/0.3-dev
